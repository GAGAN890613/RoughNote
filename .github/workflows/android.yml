name: RoughNotes Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug
      - name: Rename APK uniquely
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk "output/RoughNotes-v1-build-${GITHUB_RUN_NUMBER}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: RoughNotes-v1-build-${{ github.run_number }}
          path: output/RoughNotes-v1-build-*.apk
          retention-days: 14
